name: Build and Push Stable Docker Image
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: morgankryze
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/morgankryze/carousel:stable
            ghcr.io/morgankryze/carousel:latest
            ghcr.io/morgankryze/carousel:${{ github.event.release.tag_name }}
            ghcr.io/morgankryze/carousel:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.release.published_at }}
